name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Compile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile main + tests
        run: mvn -B clean compile test-compile

      - name: Run tests
        if: ${{ vars.RUN_TESTS == 'true' }}
        env:
          BASE_URL_EPICVIN: ${{ secrets.BASE_URL_EPICVIN }}
          VALID_EMAIL: ${{ secrets.VALID_EMAIL }}
          VALID_PASSWORD: ${{ secrets.VALID_PASSWORD }}
          DATABASE_URL_EPICVIN: ${{ secrets.DATABASE_URL_EPICVIN }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
        run: mvn -B test -Dheadless=true

      - name: Upload Allure results
        if: ${{ always() && vars.RUN_TESTS == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results
          if-no-files-found: ignore
